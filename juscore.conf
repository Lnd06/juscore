server {
    server_name juscore.net www.juscore.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/juscore.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/juscore.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.juscore.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = juscore.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    # Allow the IP directly to avoid 404
    server_name juscore.net www.juscore.net 187.77.226.73;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
