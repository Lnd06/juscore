<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Senha - JusCore AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="config_tailwind.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-primary-600 to-juri-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-lg">
        🔑
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">JusCore AI</h1>
      <p class="text-gray-600 dark:text-gray-400 text-sm">Crie uma nova senha segura</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nova Senha</label>
          <div class="relative">
            <input 
              type="password" 
              id="senha" 
              required
              class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-600 outline-none transition-all"
              placeholder="••••••••"
              oninput="validatePassword()"
            >
            <button type="button" onclick="togglePassword('senha', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>
          <!-- Real-time Validation -->
          <ul id="password-requirements" class="mt-2 text-xs space-y-1 text-gray-500 dark:text-gray-400 hidden">
            <li id="req-length" class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span> Mínimo 6 caracteres</li>
            <li id="req-upper" class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span> Letra maiúscula (A-Z)</li>
            <li id="req-lower" class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span> Letra minúscula (a-z)</li>
            <li id="req-number" class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span> Número (0-9)</li>
          </ul>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirmar Senha</label>
          <div class="relative">
            <input 
              type="password" 
              id="confirmaSenha" 
              required
              class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-600 outline-none transition-all"
              placeholder="••••••••"
            >
            <button type="button" onclick="togglePassword('confirmaSenha', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>
        </div>

        <div id="msg" class="hidden p-3 rounded-lg text-sm border"></div>

        <button 
          type="submit"
          id="submitBtn"
          class="w-full py-3 px-4 bg-gradient-to-r from-primary-600 to-juri-600 hover:from-primary-700 hover:to-juri-700 text-white font-medium rounded-xl transition-all transform hover:scale-[1.02] disabled:opacity-50"
        >
          Redefinir Senha
        </button>
      </form>
    </div>
  </div>

  <script>
    // Theme logic
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const codigo = urlParams.get('code');

    if (!email || !codigo) {
      alert('Dados inválidos. Reinicie o processo.');
      window.location.href = '/forgot-password';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const senha = document.getElementById('senha').value;
      const confirmaSenha = document.getElementById('confirmaSenha').value;

      if (senha !== confirmaSenha) {
        msg.textContent = 'As senhas não coincidem';
        msg.className = 'block p-3 bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 rounded-lg text-sm border';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Redefinindo...';
      msg.className = 'hidden p-3 rounded-lg text-sm border';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, codigo, novaSenha: senha })
        });

        const data = await res.json();

        if (res.ok) {
          msg.textContent = 'Senha alterada com sucesso! Redirecionando para login...';
          msg.className = 'block p-3 bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800 text-green-600 dark:text-green-400 rounded-lg text-sm border';
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          throw new Error(data.error || 'Erro ao redefinir senha');
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'block p-3 bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 rounded-lg text-sm border';
        btn.disabled = false;
        btn.textContent = 'Redefinir Senha';
      }
    });

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      if (isPassword) {
        btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>`;
      } else {
        btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
      }
    }

    function validatePassword() {
      const senha = document.getElementById('senha').value;
      const list = document.getElementById('password-requirements');
      
      if (senha.length > 0) list.classList.remove('hidden');
      else list.classList.add('hidden');

      const reqs = {
        length: senha.length >= 6,
        upper: /[A-Z]/.test(senha),
        lower: /[a-z]/.test(senha),
        number: /\d/.test(senha)
      };

      updateReq('req-length', reqs.length);
      updateReq('req-upper', reqs.upper);
      updateReq('req-lower', reqs.lower);
      updateReq('req-number', reqs.number);
    }

    function updateReq(id, valid) {
      const el = document.getElementById(id);
      const dot = el.querySelector('span');
      if (valid) {
        el.classList.add('text-green-600', 'dark:text-green-400');
        el.classList.remove('text-gray-500', 'dark:text-gray-400');
        dot.classList.add('bg-green-500');
        dot.classList.remove('bg-gray-300');
      } else {
        el.classList.remove('text-green-600', 'dark:text-green-400');
        el.classList.add('text-gray-500', 'dark:text-gray-400');
        dot.classList.remove('bg-green-500');
        dot.classList.add('bg-gray-300');
      }
    }
  </script>
</body>
</html>
