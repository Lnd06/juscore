  <script>
    // Fetch Dynamic Contacts
    async function loadContacts() {
      try {
        const res = await fetch('/api/public/contact');
        if (res.ok) {
          const data = await res.json();
          
          if (data.contact_email) {
            document.getElementById('btnEmail').href = `mailto:${data.contact_email}`;
            document.getElementById('txtEmail').textContent = data.contact_email;
          }
          if (data.contact_whatsapp) {
            document.getElementById('btnWhatsapp').href = data.contact_whatsapp;
            // Opcional: Mostrar o número ou manter texto padrão. Vou manter o texto ou por a mensagem personalizada.
            // document.getElementById('txtWhatsapp').textContent = 'Fale Conosco'; 
          }
          if (data.contact_instagram) {
            document.getElementById('btnInstagram').href = data.contact_instagram;
            // document.getElementById('txtInstagram').textContent = '@' + data.contact_instagram.split('/').pop(); // Tentativa de pegar user
          }
          if (data.contact_github) {
            document.getElementById('btnGithub').href = data.contact_github;
          }
        }
      } catch (err) {
        console.warn('Erro ao carregar contatos dinâmicos:', err);
      }
    }
    loadContacts();

    // Theme Logic
    const saved = localStorage.getItem("theme");
    if (saved === "dark" || !saved) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark"); // Ensure light mode if saved 'light'
    }
  </script>
