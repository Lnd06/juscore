<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Código - JusCore AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="config_tailwind.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-primary-600 to-juri-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-lg">
        ✨
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">JusCore AI</h1>
      <p class="text-gray-600 dark:text-gray-400 text-sm">Digite o código enviado para seu email</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
      <form id="verifyForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Código de 6 dígitos</label>
          <input 
            type="text" 
            id="codigo" 
            required
            maxlength="6"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-600 outline-none transition-all text-center tracking-widest text-xl"
            placeholder="000000"
          >
        </div>

        <div id="msg" class="hidden p-3 rounded-lg text-sm border"></div>

        <button 
          type="submit"
          id="submitBtn"
          class="w-full py-3 px-4 bg-gradient-to-r from-primary-600 to-juri-600 hover:from-primary-700 hover:to-juri-700 text-white font-medium rounded-xl transition-all transform hover:scale-[1.02] disabled:opacity-50"
        >
          Verificar
        </button>
      </form>
    </div>
  </div>

  <script>
    // Theme logic
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');

    if (!email) {
      alert('Email não fornecido. Volte para o início.');
      window.location.href = '/forgot-password';
    }

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const codigo = document.getElementById('codigo').value;

      btn.disabled = true;
      btn.textContent = 'Verificando...';
      msg.className = 'hidden p-3 rounded-lg text-sm border';

      try {
        const res = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, codigo })
        });

        const data = await res.json();

        if (res.ok) {
          msg.textContent = 'Código verificado! Redirecionando...';
          msg.className = 'block p-3 bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800 text-green-600 dark:text-green-400 rounded-lg text-sm border';
          setTimeout(() => {
            window.location.href = `/new-password?email=${encodeURIComponent(email)}&code=${encodeURIComponent(codigo)}`;
          }, 1000);
        } else {
          throw new Error(data.error || 'Código inválido');
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'block p-3 bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 rounded-lg text-sm border';
        btn.disabled = false;
        btn.textContent = 'Verificar';
      }
    });
  </script>
</body>
</html>
